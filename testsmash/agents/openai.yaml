interface:
  display_name: "Testsmash"
  short_description: "Orchestrated audit of the whole test and eval approach: every test cataloged as delete, unclear, or keep, harnesses reviewed, real gaps and missing approaches proposed."
  default_prompt: "Use $testsmash to run an agent-orchestrated audit of this project's tests and evals. Inventory every test as a coverage contract; fan out catalog workers, harness reviewers, gap scouts, an approach scout, and an infrastructure reviewer sized to the repo; give every test a verdict of delete, unclear, or keep with a reason code and a named mutant; review expect, property, simulation, chaos and soak, e2e, and eval harnesses as systems; propose new approaches only with a concrete first test and oracle; independently verify every deletion and gap; then return the numbers, deletion clusters, unclear tests, harness extensions, ranked new approaches, and authoring rules. Do not edit the repo; mutation probes run only in a throwaway copy."
