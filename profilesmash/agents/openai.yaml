interface:
  display_name: "Profilesmash"
  short_description: "Orchestrated audit of performance measurement infrastructure: can the project attribute a cost, trust the number, and notice a regression."
  default_prompt: "Use $profilesmash to run an agent-orchestrated audit of this project's performance measurement infrastructure: profilers, benchmarks, load tests, tracing, metrics, budgets, and regression gates. Inventory every measurement asset and build a flow-by-dimension visibility matrix as the coverage contract; fan out asset catalog workers, dimension scouts, a trust reviewer, a regression reviewer, a production visibility reviewer if deployed, and an approach scout sized to the repo; give every asset a verdict of delete, unclear, or keep with a reason code; fill every matrix cell as attributed, measured, blind, or n/a with how a regression would surface; propose instruments only with a concrete first artifact; independently verify every deletion and blind spot; then return the matrix, ranked blind spots, misleading assets, regression-detection holes, trust findings, ranked proposals, and authoring rules. Do not edit the repo; probes run only in a throwaway copy and never against shared or production systems."
